name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: the committed golden images are generated on macOS; Linux
    # rasterizes text slightly differently and pixel tests would fail.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Tests with coverage
        run: flutter test --coverage

      - name: CRAP ratchet
        run: |
          dart pub global activate crap4dart
          dart pub global run crap4dart analyze
